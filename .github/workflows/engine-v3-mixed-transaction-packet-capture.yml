name: Engine V3 Mixed Transaction Packet Capture
# Raw evidence only. Never treated as human grades or a quality comparison.

on:
  push:
    branches:
      - engine_v3
    paths:
      - ".github/workflows/engine-v3-mixed-transaction-packet-capture.yml"
      - "PWA_app/src/lib/server/hunt/live-mixed-transaction-packet-capture.test.ts"
      - "PWA_app/src/lib/server/hunt/pipeline.ts"
      - "PWA_app/src/lib/server/hunt/semantics.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-v3-mixed-transaction-packet-capture
  cancel-in-progress: false

jobs:
  capture:
    name: Bounded cross-category Divar evidence capture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: PWA_app
    env:
      LIVE_DIVAR_OBSERVATION: "1"
      HUNT_MAX_DETAILS: "2"
      MIZAN_SHADOW: "0"
      SLUG_CAPTURE_BUFFER_PATH: /tmp/engine-v3-mixed-transaction-packet-capture-slugs.jsonl
    steps:
      - name: Checkout engine_v3
        uses: actions/checkout@v4
        with:
          ref: engine_v3

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: PWA_app/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run bounded read-only cross-category capture
        run: npx vitest run src/lib/server/hunt/live-mixed-transaction-packet-capture.test.ts --reporter=verbose

      - name: Upload raw capture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-v3-mixed-transaction-packet-capture
          path: engine-v3-mixed-transaction-packet-capture.json
          if-no-files-found: warn
          retention-days: 14
