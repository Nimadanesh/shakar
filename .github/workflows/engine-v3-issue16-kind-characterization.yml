name: Engine V3 Issue 16 Kind Characterization
on:
  pull_request:
    branches: [engine_v3]
    paths:
      - ".github/workflows/engine-v3-issue16-kind-characterization.yml"
      - "PWA_app/src/lib/server/hunt/kindLexicon.ts"
      - "PWA_app/src/lib/server/hunt/kindLexicon.test.ts"
      - "PWA_app/src/lib/server/hunt/pipeline.ts"
permissions:
  contents: read
concurrency:
  group: engine-v3-issue16-kind-characterization-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: PWA_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: PWA_app/package-lock.json
      - run: npm ci
      - name: Run deterministic item-kind characterization tests
        run: npx vitest run src/lib/server/hunt/kindLexicon.test.ts --reporter=verbose
