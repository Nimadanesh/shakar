name: Engine V3 Baseline

on:
  push:
    branches:
      - engine_v3
    paths:
      - ".github/workflows/engine-v3-baseline.yml"
      - "PWA_app/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-v3-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: Node 24 baseline checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PWA_app
    steps:
      - name: Checkout engine_v3
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: PWA_app/package-lock.json

      - name: Record execution environment
        run: |
          echo "Commit: ${GITHUB_SHA}"
          echo "Branch: ${GITHUB_REF_NAME}"
          node --version
          npm --version
          python3 --version

      - name: Install locked dependencies
        id: install
        run: npm ci

      - name: Focused hunt/search tests
        if: steps.install.outcome == 'success'
        run: npm test -- src/lib/server/hunt

      - name: Full test suite
        if: steps.install.outcome == 'success'
        run: npm test

      - name: TypeScript typecheck
        if: steps.install.outcome == 'success'
        run: npm run typecheck

      - name: ESLint
        if: steps.install.outcome == 'success'
        run: npm run lint

      - name: Production build
        if: steps.install.outcome == 'success'
        run: npm run build
