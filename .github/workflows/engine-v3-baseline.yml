name: Engine V3 Baseline

on:
  push:
    branches:
      - engine_v3
    paths:
      - ".github/workflows/engine-v3-baseline.yml"
      - "PWA_app/package.json"
      - "PWA_app/package-lock.json"
      - "PWA_app/src/**"
      - "PWA_app/scripts/**"
      - "PWA_app/next.config.*"
      - "PWA_app/eslint.config.*"
      - "PWA_app/tsconfig.json"
      - "PWA_app/vitest.config.*"
      - "PWA_app/postcss.config.*"
      - "PWA_app/tailwind.config.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-v3-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: Node 24 baseline checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PWA_app
    steps:
      - name: Checkout engine_v3
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: PWA_app/package-lock.json

      - name: Record execution environment
        run: |
          echo "Commit: ${GITHUB_SHA}"
          echo "Branch: ${GITHUB_REF_NAME}"
          node --version
          npm --version
          python3 --version

      - name: Install locked dependencies
        id: install
        run: npm ci

      # These three historical research harnesses read frozen, user-specific
      # files from /home/hatch/workspace or /home/hatch/workspace/your_files.
      # Those artifacts are intentionally not copied into this public repo.
      # Exclude only these exact files from portable CI and report their
      # unavailable evidence explicitly below; do not silently call them passed.
      - name: Report external research fixtures unavailable in hosted runner
        if: always() && steps.install.outcome == 'success'
        run: |
          echo "::warning::Three research harnesses require external frozen files not present in the repository."
          echo "NOT RUN: src/lib/server/hunt/contractDeleteAudit.test.ts (requires /home/hatch/workspace/ge2-ads.json)"
          echo "NOT RUN: src/lib/server/hunt/contractGate.test.ts (requires /home/hatch/workspace/your_files/experiment-b-probe-v1.json)"
          echo "NOT RUN: src/lib/server/hunt/expAFeatures.test.ts (requires intended-contracts, round captures/grades, and snapshot artifacts under /home/hatch/workspace)"
          echo "These are unavailable-evidence items, not passing tests."

      - name: Focused hunt/search tests (portable suite)
        if: always() && steps.install.outcome == 'success'
        run: >-
          npx vitest run src/lib/server/hunt
          --exclude src/lib/server/hunt/contractDeleteAudit.test.ts
          --exclude src/lib/server/hunt/contractGate.test.ts
          --exclude src/lib/server/hunt/expAFeatures.test.ts

      - name: Full portable test suite
        if: always() && steps.install.outcome == 'success'
        run: >-
          npx vitest run
          --exclude src/lib/server/hunt/contractDeleteAudit.test.ts
          --exclude src/lib/server/hunt/contractGate.test.ts
          --exclude src/lib/server/hunt/expAFeatures.test.ts

      - name: TypeScript typecheck
        if: always() && steps.install.outcome == 'success'
        run: npm run typecheck

      - name: ESLint
        if: always() && steps.install.outcome == 'success'
        run: npm run lint

      - name: Production build
        if: always() && steps.install.outcome == 'success'
        run: npm run build
