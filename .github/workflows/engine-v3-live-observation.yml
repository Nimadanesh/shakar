# Observation output is diagnostic only; it is not a relevance judgment or paired quality comparison.
name: Engine V3 Live Observation
# Observation probes include query/listing role diagnostics; detail budget remains capped at eight.

on:
  push:
    branches:
      - engine_v3
    paths:
      - ".github/workflows/engine-v3-live-observation.yml"
      - "PWA_app/src/lib/server/hunt/pipeline.ts"
      - "PWA_app/src/lib/server/hunt/semantics.ts"
      - "PWA_app/src/lib/server/hunt/semantics-r8.test.ts"
      - "PWA_app/src/lib/server/hunt/live-divar-observation.test.ts"
      - "PWA_app/src/lib/interpret.ts"
      - "PWA_app/src/lib/interpret.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-v3-live-observation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    name: Bounded read-only Divar observation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: PWA_app
    env:
      LIVE_DIVAR_OBSERVATION: "1"
      HUNT_MAX_DETAILS: "8"
      MIZAN_SHADOW: "0"
      SLUG_CAPTURE_BUFFER_PATH: /tmp/engine-v3-live-observation-slugs.jsonl
    steps:
      - name: Checkout engine_v3
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: PWA_app/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run bounded read-only live observation
        run: npx vitest run src/lib/server/hunt/live-divar-observation.test.ts --reporter=verbose

      - name: Upload observation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-v3-live-observation-${{ github.run_number }}
          path: ${{ runner.temp }}/engine-v3-live-observation.json
          if-no-files-found: warn
          retention-days: 14
