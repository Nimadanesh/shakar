name: Engine V3 Issue 16 Cross-Category Capture
# Raw evidence only. Six-detail, three-scenario cap; no production ranking changes.

on:
  pull_request:
    branches:
      - engine_v3
    paths:
      - ".github/workflows/engine-v3-issue16-cross-category-capture.yml"
      - "PWA_app/src/lib/server/hunt/live-issue16-cross-category-capture.test.ts"
      - "PWA_app/src/lib/server/hunt/pipeline.ts"
      - "PWA_app/src/lib/server/hunt/semantics.ts"
      - "PWA_app/src/lib/server/hunt/definition.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-v3-issue16-cross-category-capture
  cancel-in-progress: false

jobs:
  capture:
    name: Bounded read-only cross-category Divar capture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: PWA_app
    env:
      LIVE_DIVAR_OBSERVATION: "1"
      HUNT_MAX_DETAILS: "2"
      MIZAN_SHADOW: "0"
      SLUG_CAPTURE_BUFFER_PATH: /tmp/engine-v3-issue16-cross-category-slugs.jsonl
    steps:
      - name: Checkout pull request revision
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: PWA_app/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run bounded Issue 16 capture
        run: npx vitest run src/lib/server/hunt/live-issue16-cross-category-capture.test.ts --reporter=verbose

      - name: Upload raw capture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-v3-issue16-cross-category-capture
          path: PWA_app/engine-v3-issue16-cross-category-capture.json
          if-no-files-found: warn
          retention-days: 14
