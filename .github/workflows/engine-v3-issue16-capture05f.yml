name: Engine V3 Issue 16 Capture 05F
# Fresh, bounded read-only counter-controls after the human-graded 05E subset.
on:
  pull_request:
    branches: [engine_v3]
    paths:
      - ".github/workflows/engine-v3-issue16-capture05f.yml"
      - "PWA_app/src/lib/server/hunt/live-issue16-capture-05f.test.ts"
      - "PWA_app/src/lib/server/hunt/pipeline.ts"
      - "PWA_app/src/lib/server/hunt/semantics.ts"
      - "PWA_app/src/lib/server/hunt/definition.ts"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-v3-issue16-capture05f
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: PWA_app
    env:
      LIVE_DIVAR_OBSERVATION: "1"
      HUNT_MAX_DETAILS: "8"
      MIZAN_SHADOW: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: PWA_app/package-lock.json
      - run: npm ci
      - name: Capture 05F — whole-vehicle and counter-controls
        env:
          SLUG_CAPTURE_BUFFER_PATH: /tmp/engine-v3-issue16-capture-05f-slugs.jsonl
        run: npx vitest run src/lib/server/hunt/live-issue16-capture-05f.test.ts --reporter=verbose
      - name: Upload Capture 05F report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-v3-issue16-capture-05f
          path: PWA_app/engine-v3-issue16-capture-05f.json
          if-no-files-found: warn
          retention-days: 14
